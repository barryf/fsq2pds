name = "fsq2pds"
main = "worker.ts"
compatibility_date = "2026-10-15"

# Every 5 minutes. Runs with no new checkins make one FSQ request and return
# before creating a Bluesky session, so createSession's daily rate limit
# isn't a concern at this cadence.
[triggers]
crons = ["*/5 * * * *"]

[vars]
FSQ_API_VERSION = "20240101"
# BSKY_PDS_URL = "https://bsky.social"  # optional; this is the default

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   FSQ_OAUTH_TOKEN, BSKY_HANDLE, BSKY_APP_PASSWORD

[[d1_databases]]
binding = "DB"
database_name = "fsq2pds"
database_id = "29ec6192-05cb-4bb0-a4d2-c0ca2446b75e"
migrations_dir = "migrations"

[observability]
enabled = true
